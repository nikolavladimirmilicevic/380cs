name: Refresh ratings

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 1 * *"   # 1st of each month (FIFA overalls change rarely)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fifa_ratings.py          # stdlib only, no dependencies
      - name: Commit if changed
        run: |
          git config user.name  "ratings-bot"
          git config user.email "actions@users.noreply.github.com"
          git add players.json
          git diff --staged --quiet || git commit -m "Refresh ratings ($(date -u +%F))"
          git push
