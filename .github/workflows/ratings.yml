name: Refresh ratings

on:
  workflow_dispatch:
    inputs:
      rebuild_history:
        description: "Re-scrape FBref history (1992-2016). Slow; only when needed."
        type: boolean
        default: false
  schedule:
    # 05:00 UTC daily. FPL only moves during the season; off-season runs are harmless.
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Deep history changes rarely, so it is committed and reused. Rebuild it
      # only on manual dispatch with rebuild_history = true.
      - name: Rebuild FBref history
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_history }}
        run: |
          pip install soccerdata pandas
          python fbref_history.py

      # Rebuild players.json: archived past seasons + live current season (+ committed history_rows.json if present)
      - name: Build ratings
        run: python build_ratings.py prod

      - name: Commit if changed
        run: |
          git config user.name  "ratings-bot"
          git config user.email "actions@users.noreply.github.com"
          git add players.json
          if [ -f history_rows.json ]; then git add history_rows.json; fi
          git diff --staged --quiet || git commit -m "Refresh ratings ($(date -u +%F))"
          git push
